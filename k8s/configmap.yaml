apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  POSTGRES_DB: k8slab
  POSTGRES_USER: k8slab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: k8slab
  DB_USER: k8slab
  DB_INIT_RETRIES: "30"
  DB_INIT_DELAY_MS: "2000"
